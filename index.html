<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Garden</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f7f8f5;--card:#fff;--text:#343735;--muted:#8c918b;
  --accent:#8fb9a1;--accent2:#dcebe1;--line:#e9ece8;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{width:min(460px,100%);margin:auto;padding:26px 18px 38px}
header{text-align:center;margin-bottom:22px}
h1{font-size:25px;margin:0 0 7px;font-weight:700;letter-spacing:.3px}
.subtitle{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 8px 24px #00000008}
h2{font-size:16px;margin:0 0 14px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px 5px;text-align:center;cursor:pointer;transition:.18s}
.choice:hover{transform:translateY(-2px)}
.choice.selected{border:2px solid var(--accent);background:#f4faf6}
.emoji{font-size:40px;line-height:1.2;margin-bottom:7px}
.name{font-size:13px}
.preview{margin-top:18px;background:#f8faf7;border-radius:20px;padding:18px;text-align:center}
.scene{height:205px;display:flex;align-items:center;justify-content:center;font-size:112px;position:relative}
.ground{position:absolute;bottom:10px;width:170px;height:22px;border-radius:50%;background:#dce9df}
.character{position:relative;z-index:2;animation:float 2.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.waterbar{height:9px;background:#e9efeb;border-radius:99px;overflow:hidden;margin:8px 0 13px}
.fill{height:100%;width:0;background:var(--accent);transition:.4s}
.stats{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
button{width:100%;border:0;background:var(--accent);color:#fff;border-radius:15px;padding:14px;font-size:15px;font-weight:650;cursor:pointer;margin-top:16px}
button:active{transform:scale(.98)}
.message{text-align:center;height:22px;margin-top:12px;font-size:13px;color:#6d786f}
.smallrow{display:flex;gap:10px;margin-top:12px}
.smallrow>div{flex:1;background:#fafbfa;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.smallrow b{display:block;font-size:17px;margin-bottom:3px}
.smallrow span{font-size:11px;color:var(--muted)}
.reset{font-size:12px;color:#a0a49f;text-align:center;text-decoration:underline;margin-top:18px;cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Water Garden</h1>
  <div class="subtitle">Drink water and grow your companion.</div>
</header>

<div class="card">
  <h2>Choose your companion</h2>
  <div class="choices" id="choices"></div>

  <div class="preview">
    <div class="scene">
      <div class="ground"></div>
      <div class="character" id="character">🌷</div>
    </div>
    <div class="stats"><span>Today</span><b id="count">0 / 8 glasses</b></div>
    <div class="waterbar"><div class="fill" id="fill"></div></div>
    <div class="stats"><span id="stage">Seedling</span><span id="percent">0%</span></div>
  </div>

  <button id="drink">+ Add a glass of water</button>
  <div class="message" id="message">Your companion grows as you drink.</div>

  <div class="smallrow">
    <div><b id="streak">1</b><span>day streak</span></div>
    <div><b id="total">0</b><span>total glasses</span></div>
  </div>
  <div class="reset" id="reset">Reset today's progress</div>
</div>
</div>

<script>
const companions=[
 {id:"tulip",name:"Tulip",emoji:["🌱","🌿","🌷","🌷"],type:"flower"},
 {id:"sunflower",name:"Sunflower",emoji:["🌱","🌿","🌻","🌻"],type:"flower"},
 {id:"daisy",name:"Daisy",emoji:["🌱","🌿","🌼","🌼"],type:"flower"},
 {id:"cat",name:"Cat",emoji:["🥚","🐱","😺","😸"],type:"animal"},
 {id:"bunny",name:"Bunny",emoji:["🥚","🐰","🐇","🐇"],type:"animal"},
 // 这里改成小狗，阶段：蛋🥚→小狗崽🐶→幼犬🐕→大狗🦮
 {id:"dog",name:"Dog",emoji:["🥚","🐶","🐕","🦮"],type:"animal"}
];
const key="water_garden_v2";
let data=JSON.parse(localStorage.getItem(key)||'{"selected":"tulip","count":0,"total":0,"streak":1}');
function save(){localStorage.setItem(key,JSON.stringify(data))}
function getStage(){return data.count>=8?3:data.count>=5?2:data.count>=2?1:0}
function renderChoices(){
 const box=document.getElementById("choices");
 box.innerHTML=companions.map(c=>`
 <div class="choice ${c.id===data.selected?'selected':''}" data-id="${c.id}">
   <div class="emoji">${c.emoji[2]}</div><div class="name">${c.name}</div>
 </div>`).join("");
 box.querySelectorAll(".choice").forEach(el=>el.onclick=()=>{
   data.selected=el.dataset.id;save();render();
 });
}
function render(){
 renderChoices();
 const c=companions.find(x=>x.id===data.selected), s=getStage();
 document.getElementById("character").textContent=c.emoji[s];
 document.getElementById("count").textContent=`${data.count} / 8 glasses`;
 document.getElementById("fill").style.width=Math.min(data.count/8*100,100)+"%";
 document.getElementById("percent").textContent=Math.round(Math.min(data.count/8*100,100))+"%";
 document.getElementById("stage").textContent=s===0?"Seedling":s===1?"Growing":s===2?"Almost grown":"Grown";
 document.getElementById("streak").textContent=data.streak;
 document.getElementById("total").textContent=data.total;
 document.getElementById("drink").textContent=data.count>=8?"Today is complete":"＋ Add a glass of water";
}
document.getElementById("drink").onclick=()=>{
 if(data.count<8){data.count++;data.total++;
   const msgs=["Added.","Growing.","Nice.","One more step.","Looking good.","Progress saved."];
   document.getElementById("message").textContent=msgs[Math.floor(Math.random()*msgs.length)];
   save();render();
 }else document.getElementById("message").textContent="Today's goal is complete.";
};
document.getElementById("reset").onclick=()=>{
 if(confirm("Reset today's progress?")){data.count=0;save();document.getElementById("message").textContent="Progress reset.";render();}
};
render();
</script>
</body>
</html>
